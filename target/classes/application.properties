spring.application.name=studentmanagement

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=B#4VY4J41NMYSQL
app.database.persistent-url=jdbc:mysql://localhost:3306/student_management

# JPA / Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Thymeleaf
spring.thymeleaf.cache=false

# Bind for cloud/runtime platforms (e.g., Render) and local fallback port
server.port=${PORT:8080}
server.address=0.0.0.0

# File upload configuration
app.upload.dir=${UPLOAD_DIR:./uploads}

# Cache (local)
spring.cache.type=simple

# Redis / real-time analytics
app.analytics.redis.enabled=${ANALYTICS_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Mail / report digests
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Analytics snapshots and leadership digests
app.analytics.snapshot.cron=${ANALYTICS_SNAPSHOT_CRON:0 0 1 * * *}
app.analytics.digest.cron=${ANALYTICS_DIGEST_CRON:0 0 7 * * *}
app.analytics.reports.enabled=${ANALYTICS_REPORTS_ENABLED:false}
app.analytics.reports.sender=${ANALYTICS_REPORT_SENDER:no-reply@bennett.edu.in}
app.analytics.reports.recipients=${ANALYTICS_REPORT_RECIPIENTS:}
app.analytics.reports.subject=${ANALYTICS_REPORT_SUBJECT:Daily AI Analytics Digest}

# JWT
app.jwt.secret=ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtbXVzdC1iZS1jaGFuZ2VkLWluLXByb2Q=
app.jwt.expiration-millis=3600000

# Mapbox
app.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# Python ML API
app.ml.api.base-url=${ML_API_BASE_URL:http://localhost:8000}
app.face.embedding-service-url=${FACE_EMBEDDING_SERVICE_URL:http://localhost:8001}
app.face.liveness-service-url=${FACE_LIVENESS_SERVICE_URL:http://localhost:8001}
app.face.embedding-encryption-key=${FACE_EMBEDDING_ENCRYPTION_KEY:}

# Logging
logging.level.org.springframework.security=INFO
