# For production, set credentials via environment variables or secrets.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}


# Analytics snapshots and leadership digests
app.analytics.snapshot.cron=${ANALYTICS_SNAPSHOT_CRON:0 0 1 * * *}
app.analytics.digest.cron=${ANALYTICS_DIGEST_CRON:0 0 7 * * *}
app.analytics.reports.enabled=${ANALYTICS_REPORTS_ENABLED:false}
app.analytics.reports.sender=${ANALYTICS_REPORT_SENDER:no-reply@bennett.edu.in}
app.analytics.reports.recipients=${ANALYTICS_REPORT_RECIPIENTS:}
app.analytics.reports.subject=${ANALYTICS_REPORT_SUBJECT:Daily AI Analytics Digest}

# JWT
app.jwt.secret=ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtbXVzdC1iZS1jaGFuZ2VkLWluLXByb2Q=
app.jwt.expiration-millis=3600000

# Auth OTP
app.auth.otp.expiry-minutes=5
app.auth.otp.reset-token-expiry-minutes=10
app.auth.otp.max-verify-attempts=5
app.auth.otp.max-requests-per-window=3
app.auth.otp.request-window-minutes=5
app.auth.otp.resend-min-seconds=30
app.auth.otp.bind-client-context=${AUTH_OTP_BIND_CLIENT_CONTEXT:false}
app.auth.otp.mail-from=${AUTH_OTP_MAIL_FROM:no-reply@student-management.local}
app.auth.otp.sms.provider=${AUTH_OTP_SMS_PROVIDER:log}
app.auth.otp.sms.fast2sms.api-key=${AUTH_OTP_SMS_FAST2SMS_API_KEY:}
app.auth.otp.sms.fast2sms.url=${AUTH_OTP_SMS_FAST2SMS_URL:https://www.fast2sms.com/dev/bulkV2}
app.auth.otp.sms.fast2sms.route=${AUTH_OTP_SMS_FAST2SMS_ROUTE:q}
# Show fallback OTP in UI if delivery fails (set to true for dev, false for prod)
app.auth.otp.dev-return-otp-when-undelivered=${AUTH_OTP_DEV_RETURN_OTP_WHEN_UNDELIVERED:false}

# Mapbox
app.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# Python ML API
app.ml.api.base-url=${ML_API_BASE_URL:http://localhost:8000}
app.face.embedding-service-url=${FACE_EMBEDDING_SERVICE_URL:http://localhost:8001}
app.face.liveness-service-url=${FACE_LIVENESS_SERVICE_URL:http://localhost:8001}
app.face.embedding-encryption-key=${FACE_EMBEDDING_ENCRYPTION_KEY:}

# Logging
logging.level.org.springframework.security=INFO
