spring.application.name=studentmanagement

# Database (default local profile)
spring.datasource.url=jdbc:h2:mem:smsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf
spring.thymeleaf.cache=false

# Bind for cloud/runtime platforms (e.g., Render) and local fallback port
server.port=${PORT:8080}
server.address=0.0.0.0

# Cache (local)
spring.cache.type=simple

# Redis / real-time analytics
app.analytics.redis.enabled=${ANALYTICS_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Mail / report digests
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}

# Analytics snapshots and leadership digests
app.analytics.snapshot.cron=${ANALYTICS_SNAPSHOT_CRON:0 0 1 * * *}
app.analytics.digest.cron=${ANALYTICS_DIGEST_CRON:0 0 7 * * *}
app.analytics.reports.enabled=${ANALYTICS_REPORTS_ENABLED:false}
app.analytics.reports.sender=${ANALYTICS_REPORT_SENDER:no-reply@bennett.edu.in}
app.analytics.reports.recipients=${ANALYTICS_REPORT_RECIPIENTS:}
app.analytics.reports.subject=${ANALYTICS_REPORT_SUBJECT:Daily AI Analytics Digest}

# JWT
app.jwt.secret=ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtbXVzdC1iZS1jaGFuZ2VkLWluLXByb2Q=
app.jwt.expiration-millis=3600000

# Mapbox
app.mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}

# Python ML API
app.ml.api.base-url=${ML_API_BASE_URL:http://localhost:8000}
app.face.embedding-service-url=${FACE_EMBEDDING_SERVICE_URL:http://localhost:8001}
app.face.embedding-encryption-key=${FACE_EMBEDDING_ENCRYPTION_KEY:}

# Logging
logging.level.org.springframework.security=INFO
