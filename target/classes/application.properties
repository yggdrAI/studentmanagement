spring.application.name=studentmanagement

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/student_management
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=B#4VY4J41NMYSQL
app.database.persistent-url=jdbc:mysql://localhost:3306/student_management

# JPA / Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.h2.H2ConsoleAutoConfiguration

# Thymeleaf
spring.thymeleaf.cache=false

# Bind for cloud/runtime platforms (e.g., Render) and local fallback port
server.port=${PORT:8080}
server.address=0.0.0.0

# File upload configuration
app.upload.dir=${UPLOAD_DIR:./uploads}

# Cache (local)
spring.cache.type=simple

# Redis / real-time analytics
app.analytics.redis.enabled=${ANALYTICS_REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s


# Mail / report digests
# --- SMTP Example for Gmail ---
# Uncomment and fill with your credentials for real email delivery
# spring.mail.host=smtp.gmail.com
