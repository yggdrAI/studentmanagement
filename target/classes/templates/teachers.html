<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='teachers')}"></div>

    <main class="content-area" id="maincontent" tabindex="-1">
        <div class="content-wrapper">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Manage Teachers</h1>
                </div>
            </header>

            <section class="generic-card">
                <h2>Faculty Roster</h2>
                <p>View, edit, or onboard new faculty members here.</p>
                <div style="margin-top: 24px;">
                    <button type="button" class="btn btn-outline">Add New Teacher</button>
                    <button type="button" class="btn btn-outline">Generate Reports</button>
                </div>
            </section>

            <section class="generic-card" style="margin-top: 1.5rem;">
                <h2>Teacher Login Credentials</h2>
                <p>Admin can reset or change passwords for all teachers from here.</p>
                <div style="overflow:auto; margin-top: 1rem;">
                    <table class="data-grid" style="min-width: 760px;">
                        <thead>
                        <tr>
                            <th>Teacher ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody id="teacherGridBody">
                        <tr><td colspan="5">Loading teachers...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/sidebar :: floating-tools}"></div>

    <script th:src="@{/js/api-client.js}"></script>
    <script th:src="@{/js/admin-teachers-passwords.js}"></script>

</body>
</html>
