<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Teachers - Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='teachers')}"></div>

    <main class="content-area" id="maincontent" tabindex="-1">
        <div class="content-wrapper">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Manage Teachers</h1>
                </div>
            </header>

            <section class="generic-card">
                <h2>Faculty Roster</h2>
                <p>View, edit, or onboard new faculty members here.</p>
                <div style="margin-top: 24px;">
                    <button type="button" class="btn btn-outline">Add New Teacher</button>
                    <button type="button" class="btn btn-outline">Generate Reports</button>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/sidebar :: floating-tools}"></div>

</body>
</html>
