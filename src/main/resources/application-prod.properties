# Production hardening profile: activate with SPRING_PROFILES_ACTIVE=prod
app.security.cookies.secure=true
app.security.enforce-https=true
app.security.headers.enabled=true
app.security.headers.csp=default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'

# Required for HTTPS redirect when app sits behind reverse proxy/load balancer.
server.forward-headers-strategy=framework
