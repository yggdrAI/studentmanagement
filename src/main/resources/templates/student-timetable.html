<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .timetable-shell {
            display: grid;
            gap: 1rem;
        }

        .session-card {
            border: 1px solid rgba(148, 163, 184, 0.35);
            border-radius: 16px;
            padding: 1rem;
            background: linear-gradient(180deg, #ffffff, #f8fbff);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.8rem;
            align-items: center;
        }

        .session-title {
            margin: 0;
            font-size: 1.05rem;
            color: #0f172a;
        }

        .session-meta {
            margin: 0.3rem 0 0;
            color: #475569;
            font-size: 0.9rem;
        }

        .timeline-empty {
            border-radius: 14px;
            border: 1px dashed #cbd5e1;
            padding: 1rem;
            color: #475569;
        }

        @media (max-width: 768px) {
            .session-card {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activeTab='timetable')}"></div>

<main class="content-area" id="maincontent" tabindex="-1">
    <div class="content-wrapper">
        <header class="page-header">
            <div>
                <h1 class="page-title">Class Timetable & Attendance</h1>
                <p class="dashboard-subtitle">See upcoming classes and scan attendance directly from each session.</p>
            </div>
        </header>

        <section class="generic-card">
            <h2>Upcoming Schedule</h2>
            <div id="timetableList" class="timetable-shell"></div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/sidebar :: floating-tools}"></div>

<script>
    function formatDateTime(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
            return 'TBA';
        }
        return date.toLocaleString([], {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function renderTimetable(items) {
        const list = document.getElementById('timetableList');
        list.innerHTML = '';

        if (!items.length) {
            list.innerHTML = '<div class="timeline-empty">No upcoming classes found.</div>';
            return;
        }

        items.forEach((session) => {
            const card = document.createElement('article');
            card.className = 'session-card';

            const details = document.createElement('div');
            details.innerHTML =
                '<h3 class="session-title">' + (session.title || 'Class Session') + '</h3>' +
                '<p class="session-meta">' + (session.courseCode || 'SUBJECT') + ' | ' + (session.facultyName || 'Faculty TBA') + '</p>' +
                '<p class="session-meta">' + formatDateTime(session.startsAt) + ' - ' + formatDateTime(session.endsAt) + '</p>' +
                '<p class="session-meta">Room: ' + (session.room || 'TBA') + '</p>';

            const action = document.createElement('a');
            const params = new URLSearchParams();
            if (session.courseId) {
                params.set('subjectId', String(session.courseId));
            }
            if (session.sessionId) {
                params.set('sessionId', String(session.sessionId));
            }
            action.href = '/attendance/scanner?' + params.toString();
            action.className = 'btn btn-primary';
            action.textContent = 'Scan Attendance';

            card.appendChild(details);
            card.appendChild(action);
            list.appendChild(card);
        });
    }

    async function loadTimetable() {
        const response = await fetch('/api/student/timetable', { headers: { Accept: 'application/json' } });
        if (!response.ok) {
            document.getElementById('timetableList').innerHTML = '<div class="timeline-empty">Failed to load timetable.</div>';
            return;
        }

        const data = await response.json();
        renderTimetable(Array.isArray(data) ? data : []);
    }

    loadTimetable();
</script>

</body>
</html>
