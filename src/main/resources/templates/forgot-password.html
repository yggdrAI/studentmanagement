<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Student Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eef2ff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --border: #dbeafe;
            --danger: #b91c1c;
            --success: #166534;
        }

        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 20% 20%, #bfdbfe 0%, transparent 35%),
                        radial-gradient(circle at 80% 80%, #7dd3fc 0%, transparent 40%),
                        var(--bg);
            color: var(--text);
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(2, 132, 199, 0.15);
            padding: 28px;
        }

        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 18px; color: var(--muted); }

        .row { margin-bottom: 14px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; color: var(--muted); }

        input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px;
            font-size: 14px;
            color: var(--text);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.15);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 15px;
            font-weight: 600;
            padding: 12px;
            cursor: pointer;
            margin-top: 4px;
        }

        .btn.secondary {
            background: #e2e8f0;
            color: #1e293b;
            margin-top: 10px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .steps { display: grid; gap: 10px; }
        .hidden { display: none; }

        .msg {
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .msg.error { background: #fee2e2; color: var(--danger); }
        .msg.success { background: #dcfce7; color: var(--success); }

        .meter {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .meter > span {
            display: block;
            height: 100%;
            width: 0;
            transition: width 0.2s ease;
            background: #ef4444;
        }

        .meta {
            margin-top: 8px;
            font-size: 13px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }

        a { color: var(--primary-dark); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="card">
    <h1>Reset your password</h1>
    <p>Use your university email or registered phone number.</p>

    <div id="message" class="msg hidden"></div>

    <div class="steps" id="step1">
        <div class="row">
            <label for="identifier">Email or phone</label>
            <input id="identifier" type="text" placeholder="student@univ.edu or 9876543210" required>
        </div>
        <button class="btn" id="sendOtpBtn" type="button">Send OTP</button>
    </div>

    <div class="steps hidden" id="step2">
        <div class="row">
            <label for="otpCode">Enter OTP</label>
            <input id="otpCode" type="text" maxlength="6" placeholder="6-digit OTP" required>
            <div class="meta">
                <span id="otpTimer">OTP expires in 10:00</span>
                <button class="btn secondary" id="resendOtpBtn" type="button" disabled>Resend OTP</button>
            </div>
        </div>
        <button class="btn" id="verifyOtpBtn" type="button">Verify OTP</button>
    </div>

    <div class="steps hidden" id="step3">
        <div class="row">
            <label for="newPassword">New password</label>
            <input id="newPassword" type="password" placeholder="Create a strong password" required>
            <div class="meter"><span id="strengthBar"></span></div>
            <div class="meta"><span id="strengthText">Strength: weak</span><span>Use upper/lower/number/symbol</span></div>
        </div>
        <div class="row">
            <label for="confirmPassword">Confirm new password</label>
            <input id="confirmPassword" type="password" placeholder="Re-enter new password" required>
        </div>
        <button class="btn" id="resetPasswordBtn" type="button">Reset Password</button>
    </div>

    <p style="margin-top:16px; margin-bottom:0;">Back to <a href="/login">Sign in</a></p>
</div>

<script src="/js/api-client.js"></script>
<script>
    (function () {
        const message = document.getElementById('message');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');

        const identifierInput = document.getElementById('identifier');
        const otpInput = document.getElementById('otpCode');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const verifyOtpBtn = document.getElementById('verifyOtpBtn');
        const resetPasswordBtn = document.getElementById('resetPasswordBtn');
        const resendOtpBtn = document.getElementById('resendOtpBtn');

        const otpTimer = document.getElementById('otpTimer');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        let resetToken = '';
        let timerInterval = null;
        let timerRemaining = 600;
        let otpPreviewText = '';

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'msg ' + type;
        }

        function hideMessage() {
            message.className = 'msg hidden';
            message.textContent = '';
        }

        function startTimer(seconds) {
            timerRemaining = seconds;
            resendOtpBtn.disabled = true;
            clearInterval(timerInterval);

            timerInterval = setInterval(function () {
                timerRemaining -= 1;
                const mins = String(Math.max(0, Math.floor(timerRemaining / 60))).padStart(2, '0');
                const secs = String(Math.max(0, timerRemaining % 60)).padStart(2, '0');
                otpTimer.textContent = 'OTP expires in ' + mins + ':' + secs;

                if (timerRemaining <= 0) {
                    clearInterval(timerInterval);
                    otpTimer.textContent = 'OTP expired. Request a new one.';
                    resendOtpBtn.disabled = false;
                }
            }, 1000);
        }

        function scorePassword(value) {
            let score = 0;
            if (value.length >= 8) score += 1;
            if (/[A-Z]/.test(value)) score += 1;
            if (/[a-z]/.test(value)) score += 1;
            if (/\d/.test(value)) score += 1;
            if (/[^A-Za-z0-9]/.test(value)) score += 1;
            return score;
        }

        function renderStrength(value) {
            const score = scorePassword(value);
            const width = Math.min(100, score * 20);
            strengthBar.style.width = width + '%';

            if (score <= 2) {
                strengthBar.style.background = '#ef4444';
                strengthText.textContent = 'Strength: weak';
            } else if (score <= 3) {
                strengthBar.style.background = '#f59e0b';
                strengthText.textContent = 'Strength: medium';
            } else {
                strengthBar.style.background = '#16a34a';
                strengthText.textContent = 'Strength: strong';
            }
        }

        sendOtpBtn.addEventListener('click', async function () {
            hideMessage();
            const identifier = identifierInput.value.trim();
            if (!identifier) {
                showMessage('Please enter your email or phone.', 'error');
                return;
            }

            sendOtpBtn.disabled = true;
            try {
                const response = await window.smsApi.auth.forgotPassword({ identifier: identifier });
                otpPreviewText = (response && response.otpPreview) ? String(response.otpPreview) : '';

                if (otpPreviewText) {
                    showMessage('Delivery is not configured. Use OTP: ' + otpPreviewText, 'success');
                } else {
                    showMessage('OTP sent successfully. Check your email or SMS.', 'success');
                }
                step2.classList.remove('hidden');
                startTimer(600);
            } catch (error) {
                showMessage(error.message || 'Unable to send OTP', 'error');
            } finally {
                sendOtpBtn.disabled = false;
            }
        });

        resendOtpBtn.addEventListener('click', async function () {
            hideMessage();
            const identifier = identifierInput.value.trim();
            if (!identifier) {
                showMessage('Please provide your email or phone first.', 'error');
                return;
            }

            resendOtpBtn.disabled = true;
            try {
                const response = await window.smsApi.auth.forgotPassword({ identifier: identifier });
                otpPreviewText = (response && response.otpPreview) ? String(response.otpPreview) : '';

                if (otpPreviewText) {
                    showMessage('New OTP generated. Use OTP: ' + otpPreviewText, 'success');
                } else {
                    showMessage('A new OTP has been sent.', 'success');
                }
                startTimer(600);
            } catch (error) {
                showMessage(error.message || 'Unable to resend OTP', 'error');
                resendOtpBtn.disabled = false;
            }
        });

        verifyOtpBtn.addEventListener('click', async function () {
            hideMessage();
            const identifier = identifierInput.value.trim();
            const otpCode = otpInput.value.trim();

            if (!/^\d{6}$/.test(otpCode)) {
                showMessage('Enter a valid 6-digit OTP.', 'error');
                return;
            }

            verifyOtpBtn.disabled = true;
            try {
                const response = await window.smsApi.auth.verifyOtp({ identifier: identifier, otpCode: otpCode });
                resetToken = response.resetToken;
                step3.classList.remove('hidden');
                showMessage('OTP verified. You can now set a new password.', 'success');
            } catch (error) {
                showMessage(error.message || 'OTP verification failed', 'error');
            } finally {
                verifyOtpBtn.disabled = false;
            }
        });

        resetPasswordBtn.addEventListener('click', async function () {
            hideMessage();
            const identifier = identifierInput.value.trim();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!resetToken) {
                showMessage('Verify OTP before resetting password.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Confirm password does not match.', 'error');
                return;
            }

            resetPasswordBtn.disabled = true;
            try {
                await window.smsApi.auth.resetPassword({
                    identifier: identifier,
                    resetToken: resetToken,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                });
                showMessage('Password reset successful. Redirecting to sign in...', 'success');
                setTimeout(function () { window.location.href = '/login'; }, 1200);
            } catch (error) {
                showMessage(error.message || 'Unable to reset password', 'error');
            } finally {
                resetPasswordBtn.disabled = false;
            }
        });

        newPasswordInput.addEventListener('input', function () {
            renderStrength(newPasswordInput.value || '');
        });
    })();
</script>
</body>
</html>
