<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafeteria - Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='cafeteria')}"></div>

    <main class="content-area" id="maincontent" tabindex="-1">
        <div class="content-wrapper">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Cafeteria Services 🍔</h1>
                </div>
            </header>

            <section class="generic-card">
                <h2>Today's Special</h2>
                <p>The cafeteria is serving a special Deluxe Meal Combo today!</p>
                <button type="button" class="btn btn-outline" style="margin-top: 16px;">View Full Menu</button>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/sidebar :: floating-tools}"></div>

</body>
</html>
