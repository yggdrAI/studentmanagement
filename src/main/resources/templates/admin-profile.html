<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <style>
        .admin-profile-wrap {
            max-width: 980px;
        }

        .admin-profile-card {
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.28);
            background: linear-gradient(145deg, #071430, #0a1f47);
            color: #e2e8f0;
            padding: 1.25rem;
            box-shadow: 0 12px 28px rgba(2, 6, 23, 0.26);
        }

        .admin-title {
            margin: 0;
            font-size: 1.5rem;
            color: #f8fafc;
        }

        .admin-subtitle {
            margin: 0.35rem 0 1rem;
            color: #93c5fd;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            border: 1px solid rgba(148, 163, 184, 0.45);
            border-radius: 999px;
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #bfdbfe;
            margin-bottom: 1rem;
        }

        .profile-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.85rem;
        }

        .profile-item {
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;
            padding: 0.85rem;
            background: rgba(15, 23, 42, 0.38);
        }

        .profile-label {
            display: block;
            color: #93c5fd;
            font-size: 0.78rem;
            margin-bottom: 0.25rem;
        }

        .profile-value {
            margin: 0;
            font-size: 1.03rem;
            font-weight: 600;
            color: #e2e8f0;
        }

        .profile-item.full {
            grid-column: 1 / -1;
        }


        @media (max-width: 760px) {
            .profile-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/sidebar :: sidebar(activeTab='dashboard')}"></div>

<main class="content-area" id="maincontent" tabindex="-1">
    <div class="content-wrapper admin-profile-wrap">
        <section class="admin-profile-card">
            <h1 class="admin-title">Admin Profile</h1>
            <p class="admin-subtitle">This profile is for administrator access and management controls.</p>
            <span class="pill" th:text="${adminRole}">ADMIN</span>

            <div class="profile-grid">
                <article class="profile-item full">
                    <span class="profile-label">Name</span>
                    <p class="profile-value" th:text="${adminName}">The Creator, Bhavya Jain</p>
                </article>
                <article class="profile-item">
                    <span class="profile-label">Email</span>
                    <p class="profile-value" th:text="${adminEmail}">bhavyajain15007@gmail.com</p>
                </article>
                <article class="profile-item">
                    <span class="profile-label">Role</span>
                    <p class="profile-value" th:text="${adminRole}">ADMIN</p>
                </article>
                <article class="profile-item">
                    <span class="profile-label">Date of Birth</span>
                    <p class="profile-value" th:text="${adminDob}">15-03-2007</p>
                </article>
                <article class="profile-item">
                    <span class="profile-label">Gender</span>
                    <p class="profile-value" th:text="${adminGender}">Male</p>
                </article>
                <article class="profile-item full">
                    <span class="profile-label">Department</span>
                    <p class="profile-value" th:text="${adminDepartment}">School of Computer Science &amp; Tech</p>
                </article>
                <article class="profile-item full">
                    <span class="profile-label">Designation</span>
                    <p class="profile-value" th:text="${adminDesignation}">System Creator</p>
                </article>
            </div>

        </section>
    </div>
</main>

<div th:replace="~{fragments/sidebar :: floating-tools}"></div>
</body>
</html>
