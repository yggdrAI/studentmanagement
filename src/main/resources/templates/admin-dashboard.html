<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student Portal</title>
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
    <!-- Global Dashboard CSS -->
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

    <!-- Inject Sidebar Fragment passing 'dashboard' as the active tab -->
    <div th:replace="~{fragments/sidebar :: sidebar(activeTab='dashboard')}"></div>

    <!-- Main Content -->
    <main class="content-area" id="maincontent" tabindex="-1">
        <div class="content-wrapper">
            
            <header class="page-header">
                <div>
                    <!-- Dynamic Title showing the user role -->
                    <h1 class="page-title">
                        Welcome <span th:text="${#authentication.name}">User</span>!
                        <span class="status-badge">Active</span>
                    </h1>
                </div>
            </header>

            <section class="info-card" aria-labelledby="adminOverviewHeading">
                <h2 id="adminOverviewHeading" class="sr-only">Admin Overview</h2>
                <div class="grid-info">
                    <div class="data-group"><span class="data-label">Profile</span><span class="data-value">The Creator, Bhavya Jain</span></div>
                    <div class="data-group"><span class="data-label">Role</span><span class="data-value">ADMIN</span></div>
                    <div class="data-group"><span class="data-label">Students in Database</span><span class="data-value" th:text="${studentCount}">0</span></div>
                    <div class="data-group"><span class="data-label">Dashboard Type</span><span class="data-value">Administrator Console</span></div>
                </div>
            </section>

            <section class="generic-card" style="margin-top: 24px;">
                <header class="page-header">
                    <div>
                        <h2 class="page-title">Quick Actions</h2>
                        <p class="page-subtitle">Manage student records and open your admin profile.</p>
                    </div>
                </header>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a class="btn btn-primary" th:href="@{/admin/students}">Open Manage Students</a>
                    <a class="btn btn-primary" th:href="@{/ai-insights}">Open AI Insights</a>
                    <a class="btn btn-outline" th:href="@{/admin/profile}">Open Admin Profile</a>
                </div>
            </section>

        </div>
    </main>

    <!-- Inject Floating Tools Fragment -->
    <div th:replace="~{fragments/sidebar :: floating-tools}"></div>

</body>
</html>
