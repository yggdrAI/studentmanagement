spring.datasource.url=jdbc:postgresql://localhost:5432/studentmanagement
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
app.database.persistent-url=${PERSISTENT_DB_URL:jdbc:h2:file:./data/studentmanagement;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.face.embedding-service-url=${FACE_EMBEDDING_SERVICE_URL:http://localhost:8001}
app.face.liveness-service-url=${FACE_LIVENESS_SERVICE_URL:http://localhost:8001}
app.face.embedding-encryption-key=${FACE_EMBEDDING_ENCRYPTION_KEY:}
