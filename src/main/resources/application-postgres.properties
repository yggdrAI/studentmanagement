spring.datasource.url=jdbc:postgresql://localhost:5432/studentmanagement
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

app.face.embedding-service-url=${FACE_EMBEDDING_SERVICE_URL:http://localhost:8001}
app.face.embedding-encryption-key=${FACE_EMBEDDING_ENCRYPTION_KEY:}
