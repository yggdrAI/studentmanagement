spring.application.name=studentmanagement

# Database (default local profile)
spring.datasource.url=jdbc:h2:mem:smsdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Thymeleaf
spring.thymeleaf.cache=false

# Cache (local)
spring.cache.type=simple

# JWT
app.jwt.secret=ZmFrZS1kZXZlbG9wbWVudC1zZWNyZXQtbXVzdC1iZS1jaGFuZ2VkLWluLXByb2Q=
app.jwt.expiration-millis=3600000

# Logging
logging.level.org.springframework.security=INFO
