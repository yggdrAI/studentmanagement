services:
  mysql:
    image: mysql:8.0.36
    container_name: studentmanagement-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: student_management
      MYSQL_USER: sms_user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: B#4VY4J41NMYSQL
      TZ: UTC
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pB#4VY4J41NMYSQL"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ml-api:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: studentmanagement-ml-api
    ports:
      - "8000:8000"
    environment:
      - SERVICE_ROLE=ml-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  face-embedding:
    build:
      context: ./ml-api
      dockerfile: Dockerfile
    container_name: studentmanagement-face-embedding
    ports:
      - "8001:8000"
    environment:
      - SERVICE_ROLE=face-embedding
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  face-edge:
    image: nginx:1.27-alpine
    container_name: studentmanagement-face-edge
    profiles: ["edge"]
    ports:
      - "8088:80"
    volumes:
      - ./nginx/face-edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      face-embedding:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
